<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Movie Tracker</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body style="display: flex; justify-content: center; align-items: center; min-height: 100vh; background-color: #0f172a; font-family: system-ui, sans-serif; margin: 0;">

    <div style="background: #1e293b; padding: 2.5rem; border-radius: 12px; width: 100%; max-width: 360px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); text-align: center; color: white;">
        <h2 style="margin-top: 0; margin-bottom: 1.5rem; font-size: 1.5rem;">🎬 Movie Tracker Login</h2>

        {% if error %}
            <div style="background-color: #f87171; color: #7f1d1d; padding: 0.75rem; border-radius: 6px; margin-bottom: 1rem; font-size: 0.9rem;">
                {{ error }}
            </div>
        {% endif %}

        <form action="/login" method="POST" style="display: flex; flex-direction: column; gap: 1rem;">
            <input type="text" name="username" placeholder="Username" required style="padding: 0.75rem; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: white; outline: none;">
            <input type="password" name="password" placeholder="Password" required style="padding: 0.75rem; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: white; outline: none;">
            <button type="submit" style="padding: 0.75rem; border-radius: 6px; border: none; background-color: #3b82f6; color: white; font-weight: bold; cursor: pointer;">Sign In</button>
        </form>
    </div>

</body>
</html>
